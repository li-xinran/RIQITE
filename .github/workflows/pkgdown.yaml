# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        # Equivalent to pkgdown::build_site_github_pages(), except the
        # build_site() call is wrapped to tolerate a known pkgdown/pandoc
        # incompatibility in the (optional) llms.txt doc generation step
        # ("definition_lists ... not supported for gfm"); all HTML pages
        # are already written to disk by the time that step runs, so this
        # just keeps a cosmetic, unrelated failure from breaking deploys.
        run: |
          pkg <- pkgdown::as_pkgdown(".", override = list(destination = "docs"))
          pkgdown::clean_site(pkg)
          tryCatch(
            pkgdown::build_site(pkg, preview = FALSE, install = FALSE, new_process = FALSE),
            error = function(e) {
              if (!grepl("pandoc document conversion failed", conditionMessage(e), fixed = TRUE)) stop(e)
              message("Ignoring known llms.txt pandoc incompatibility: ", conditionMessage(e))
            }
          )
          # pkgdown renders every top-level *.md file as a page regardless
          # of .Rbuildignore; CLAUDE.md is agent guidance, not user docs.
          unlink("docs/CLAUDE.html")
          pkgdown:::build_github_pages(pkg)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
